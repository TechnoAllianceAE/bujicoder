name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > /tmp/vuln.json || true
          # GO-2026-5932 is a permanent, reviewed exception: golang.org/x/crypto/openpgp
          # is unconditionally linked by creativeprojects/go-selfupdate (its PGPValidator
          # lives in the same package). We use ChecksumValidator, never the openpgp code
          # path. Unfixable until upstream removes the import.
          jq -r '.findings[]? | select(.trace[0].module != "golang.org/x/crypto" or .osv != "GO-2026-5932") | .osv' \
            /tmp/vuln.json | sort -u > /tmp/findings
          if [ -s /tmp/findings ]; then
            echo "New vulnerabilities found:"
            cat /tmp/findings
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  guard:
    name: Enterprise code guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for enterprise imports
        run: |
          if grep -r 'gateway/' --include='*.go' .; then
            echo "ERROR: Found gateway/ imports in public repo"
            exit 1
          fi
          if grep -r 'shared/database/' --include='*.go' .; then
            echo "ERROR: Found shared/database/ imports in public repo"
            exit 1
          fi
          if grep -r 'shared/cache/' --include='*.go' .; then
            echo "ERROR: Found shared/cache/ imports in public repo"
            exit 1
          fi
          if grep -r 'shared/events/' --include='*.go' .; then
            echo "ERROR: Found shared/events/ imports in public repo"
            exit 1
          fi
          if grep -r 'shared/auth/' --include='*.go' .; then
            echo "ERROR: Found shared/auth/ imports in public repo"
            exit 1
          fi
          if grep -r 'cli/sdk/' --include='*.go' .; then
            echo "ERROR: Found cli/sdk/ imports in public repo"
            exit 1
          fi
          echo "No enterprise imports found"

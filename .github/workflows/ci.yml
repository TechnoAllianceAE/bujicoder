name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > /tmp/vuln.json || true
          # GO-2026-5932 is a permanent, reviewed exception: golang.org/x/crypto/openpgp
          # is unconditionally linked by creativeprojects/go-selfupdate (its PGPValidator
          # lives in the same package). We use ChecksumValidator, never the openpgp code
          # path. Unfixable until upstream removes the import.
          jq -r '.findings[]? | select(.trace[0].module != "golang.org/x/crypto" or .osv != "GO-2026-5932") | .osv' \
            /tmp/vuln.json | sort -u > /tmp/findings
          if [ -s /tmp/findings ]; then
            echo "New vulnerabilities found:"
            cat /tmp/findings
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  guard:
    name: Enterprise code guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for enterprise imports
        run: |
          # Match actual import declarations of internal enterprise packages,
          # not arbitrary occurrences of the substring (API URLs like
          # api.kilo.ai/api/gateway/ and doc comments must not trip this).
          set -eu
          FOUND=0
          for pkg in \
            "github.com/TechnoAllianceAE/bujicoder/gateway/" \
            "github.com/TechnoAllianceAE/bujicoder/shared/database/" \
            "github.com/TechnoAllianceAE/bujicoder/shared/cache/" \
            "github.com/TechnoAllianceAE/bujicoder/shared/events/" \
            "github.com/TechnoAllianceAE/bujicoder/shared/auth/" \
            "github.com/TechnoAllianceAE/bujicoder/cli/sdk/"; do
            if grep -r --include='*.go' -F "\"${pkg}" .; then
              echo "ERROR: Found enterprise import ${pkg} in public repo"
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then exit 1; fi
          echo "No enterprise imports found"
